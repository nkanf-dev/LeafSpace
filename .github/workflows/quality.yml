name: Zoom rounding measurement
on:
  push:
    branches: [dev/diag-zoom-rounding]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npx playwright test zoom-position.test.ts fit-width.test.ts --project=${{ matrix.engine }} --workers=1 --retries=0
      - run: npx playwright test zoom-position.test.ts --project=webkit --workers=1 --retries=0 --repeat-each=5 --output=test-results-repeat --grep 'toolbar zoom preserves'
        if: matrix.engine == 'webkit'
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-repeat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zoom-rounding-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
            playwright-report-repeat/
            test-results-repeat/
          retention-days: 14
