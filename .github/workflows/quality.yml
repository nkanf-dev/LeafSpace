name: Page raster recovery evidence
on:
  push:
    branches: ['dev/diag-render-recovery']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test render-recovery.test.ts --project=chromium --grep 'rejected raster' --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leafspace-render-recovery-baseline
          path: |
            playwright-report/
            test-results/
          retention-days: 14
