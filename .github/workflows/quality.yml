name: Internal PDF link evidence
on:
  push:
    branches: ['dev/diag-pdf-links']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test pdf-links.test.ts --grep 'pending PDF link' --project=chromium --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leafspace-link-intent-baseline
          path: |
            playwright-report/
            test-results/
          retention-days: 14
