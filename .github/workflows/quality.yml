name: Mobile reference teardown comparison
on:
  push:
    branches: [dev/diag-backdrop-reference-close]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            ref: 769654da5387bcb6bd663893086373cac70d6912
          - label: backdrop
            ref: b07dce9659d3c5b9af4e218fbf4d0ed6b3b07a31
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test responsive.test.ts --project=mobile --workers=1 --retries=0 --repeat-each=20 --grep 'Escape dismisses a compact held-page drawer'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-close-${{ matrix.label }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
