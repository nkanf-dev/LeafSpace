name: Unsaved exit and recovery contracts
on:
  push:
    branches: [dev/diag-unsaved-exit]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npx playwright test unsaved-exit.test.ts persistence.test.ts storage-recovery.test.ts --project=${{ matrix.engine }} --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsaved-exit-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
