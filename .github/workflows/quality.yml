name: Mouse pan target comparison
on:
  push:
    branches: [dev/diag-pan-target]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: [ce59b35e3f0069c3c9f7dcdbee48eb65cd78f7a7, 5475ec941c95371d05b63df4e2963f606a2e1367]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          cp src/tests/e2e/pan-owner-diagnostic.test.ts /tmp/pan-owner-diagnostic.test.ts
          git checkout --detach '${{ matrix.source }}'
          cp /tmp/pan-owner-diagnostic.test.ts src/tests/e2e/pan-owner-diagnostic.test.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test pan-owner-diagnostic.test.ts --project=webkit --workers=1 --repeat-each=5 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pan-target-${{ matrix.source }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
