name: Targeted canvas diagnosis
on:
  push:
    branches: ['dev/diag-storage-canvas']
permissions:
  contents: read
jobs:
  webkit-canvas-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test storage-metadata.test.ts --project=webkit --workers=1 --grep 'during schema failure' --repeat-each=5 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leafspace-canvas-diagnosis
          path: |
            playwright-report/
            test-results/
          retention-days: 14
