name: PDF decoder evidence
on:
  push:
    branches: ['dev/diag-pdf-decoders']
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test pdf-decoders.test.ts --project=chromium --workers=1 --retries=0 --grep 'RGB control|native WASM'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leafspace-pdf-decoder-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
