name: Mixed-page evidence
on:
  push:
    branches: ['dev/diag-mixed-pages']
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test mixed-pages.test.ts --project=chromium --project=mobile --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leafspace-mixed-page-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
