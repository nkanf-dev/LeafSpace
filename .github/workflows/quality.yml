name: Page raster recovery evidence
on:
  push:
    branches: ['dev/diag-render-recovery']
permissions:
  contents: read
jobs:
  timeline_stability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test gesture-contract.test.ts --project=webkit --grep 'timeline Escape' --repeat-each=10 --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leafspace-timeline-stability
          path: |
            playwright-report/
            test-results/
          retention-days: 14
