name: Quick Flip backdrop release check
on:
  push:
    branches: [dev/diag-backdrop-resilience]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: |
          if [ "${{ matrix.engine }}" = "chromium" ]; then
            npx playwright test thumbnail-actions.test.ts --project=chromium --project=tablet --project=mobile --workers=1 --retries=0 --grep 'Quick Flip remains calm'
          elif [ "${{ matrix.engine }}" = "webkit" ]; then
            npx playwright test thumbnail-actions.test.ts --project=webkit --project=mobile-webkit --workers=1 --retries=0 --grep 'Quick Flip remains calm'
          else
            npx playwright test thumbnail-actions.test.ts --project=firefox --workers=1 --retries=0 --grep 'Quick Flip remains calm'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quickflip-backdrop-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
