name: Targeted Quick Flip key diagnosis
on:
  push:
    branches: ['dev/diag-quickflip-release']
permissions:
  contents: read
jobs:
  firefox-key-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npx playwright test workflow.test.ts --project=firefox --workers=2 --grep 'Escape cancels selection' --repeat-each=20 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leafspace-key-diagnosis
          path: |
            playwright-report/
            test-results/
          retention-days: 14
